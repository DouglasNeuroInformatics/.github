name: App Release
on:
  workflow_call:
    inputs:
      org:
        description: 'the organization that owns the packages to publish'
        required: true
        type: 'string'
      packages:
        description: 'the comma delineated names of the packages to publish'
        required: true
        type: 'string'
defaults:
  run:
    shell: bash
permissions:
  contents: read
  packages: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.script.outputs.result }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      # - name: Checkout Scripts
      #   uses: actions/checkout@v4
      #   with:
      #     repository: DouglasNeuroinformatics/.github
      #     path: __workflow_internal
      #     sparse-checkout: |
      #       lib
      #     sparse-checkout-cone-mode: false
      # - name: Get Package Version
      #   id: current_version
      #   run: echo "result=$(cat package.json | jq -r .version)" | sudo tee -a "$GITHUB_OUTPUT"
      - name: Run Script
        uses: actions/github-script@v7
        id: script
        with:
          result-encoding: string
          script: |
            const main = require('${{ github.workspace }}/.github/lib/app-release.cjs');
            const org = '${{ inputs.org }}';
            const packages = '${{ inputs.packages }}';
            return await main({ context, core, github, exec, glob, io, inputs: { org, packages } });
  build:
    runs-on: ubuntu-latest
    needs: [configure]
    if: ${{ needs.configure.outputs.result }}
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.configure.outputs.result) }}
    steps:
      - run: echo "Matrix - Dockerfile ${{ matrix.dockerfile }}, Image ${{ matrix.image }}"
