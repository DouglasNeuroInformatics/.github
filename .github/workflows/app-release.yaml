name: App Release
on:
  workflow_call:
    inputs:
      org:
        description: 'the organization that owns the packages to publish'
        required: true
        type: 'string'
      packages:
        description: 'the comma delineated names of the packages to publish'
        required: true
        type: 'string'
      validate_command:
        description: 'a command to run before build'
        required: true
        type: 'string'
    # secrets:
    #   GITHUB_TOKEN:
    #     required: true
defaults:
  run:
    shell: bash
permissions:
  contents: read
  packages: write
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  configure:
    runs-on: ubuntu-latest
    outputs:
      result: ${{ steps.script.outputs.result }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Checkout Scripts
        uses: actions/checkout@v4
        with:
          repository: DouglasNeuroinformatics/.github
          path: __workflow_internal
          sparse-checkout: |
            lib
            vendor
          sparse-checkout-cone-mode: false
      - run: cat './__workflow_internal/lib/app-release.cjs'
      - name: Run Script
        uses: actions/github-script@v7
        id: script
        with:
          result-encoding: string
          script: |
            const main = require('./__workflow_internal/lib/app-release.cjs');
            const org = '${{ inputs.org }}';
            const packages = '${{ inputs.packages }}';
            return await main({ context, core, github, exec, glob, io, inputs: { org, packages } });
  validate:
    runs-on: ubuntu-latest
    if: ${{ inputs.validate_command }}
    steps:
      - name: Act Workaround # https://github.com/nektos/act/issues/973
        if: ${{ env.ACT }}
        run: echo /opt/acttoolcache/node/20.19.0/x64/bin >> $GITHUB_PATH
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Setup PNPM
        uses: pnpm/action-setup@v3
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          cache: ${{ !env.ACT && 'pnpm' || ''  }}
          node-version-file: '.nvmrc'
      - name: Install Dependencies
        run: pnpm install --frozen-lockfile
      - name: Validate
        run: ${{ inputs.validate_command }}
  build:
    runs-on: ubuntu-latest
    needs: [configure, validate]
    if: ${{ needs.configure.outputs.result != 'null' }}
    strategy:
      fail-fast: true
      matrix: ${{ fromJSON(needs.configure.outputs.result).buildMatrix }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Set Up QEMU
        uses: docker/setup-qemu-action@v3
      - name: Set Up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ inputs.org }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract Metadata for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ matrix.image }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ fromJSON(needs.configure.outputs.result).currentVersion }}
      - name: Build and Push Docker Images
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
  release:
    runs-on: ubuntu-latest
    needs:
      - build
      - configure
    permissions:
      contents: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ fromJSON(needs.configure.outputs.result).currentVersion }}
